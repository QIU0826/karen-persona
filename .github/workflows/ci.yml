name: CI

# 提交到任意分支、以及所有 PR 都会跑：
#   安装锁定依赖（npm ci）→ 类型检查（tsc --noEmit）→ lint（未使用代码）→ 单元测试（vitest run）
#   Linux 额外跑覆盖率基线（npm run test:coverage，阈值见 vitest.config.ts）
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # 三平台矩阵：macOS/Windows 用户是主要目标（原生 better-sqlite3 安装是否可用必须双端验证）
  check:
    name: typecheck & test (${{ matrix.os }} / Node 22)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 仓库使用 npm + package-lock.json；CI 用 npm ci 保证可复现安装
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 零新依赖的 lint：用 tsc 的 noUnusedLocals/noUnusedParameters 查未使用导入/变量/参数
      - name: Lint (unused code)
        run: npm run lint

      - name: Unit tests
        run: npm test

      # 覆盖率基线只在 Linux 跑一次（三平台测试已覆盖安装/行为，避免三倍耗时）
      - name: Coverage baseline (Linux)
        if: runner.os == 'Linux'
        run: npm run test:coverage
