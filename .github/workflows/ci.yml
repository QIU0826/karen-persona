name: CI

# 提交到任意分支、以及所有 PR 都会跑：
#   安装锁定依赖（npm ci）→ 类型检查（tsc --noEmit）→ lint（未使用代码）→ 单元测试（vitest run）
#   Linux 额外跑：覆盖率基线（阈值见 vitest.config.ts）+ 离线评测守门（npm run eval:offline，
#   40 条记忆金标 + 30 条锚点金标，卡 facts≥95% / recall@8≥90% / 合并≥95% / anti-forget PASS）
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # 三平台矩阵：macOS/Windows 用户是主要目标（原生 better-sqlite3 安装是否可用必须双端验证）
  check:
    name: typecheck & test (${{ matrix.os }} / Node 22)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 仓库使用 npm + package-lock.json；CI 用 npm ci 保证可复现安装
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 零新依赖的 lint：用 tsc 的 noUnusedLocals/noUnusedParameters 查未使用导入/变量/参数
      - name: Lint (unused code)
        run: npm run lint

      - name: Unit tests
        run: npm test

      # 覆盖率基线只在 Linux 跑一次（三平台测试已覆盖安装/行为，避免三倍耗时）
      - name: Coverage baseline (Linux)
        if: runner.os == 'Linux'
        run: npm run test:coverage

      # 离线评测守门（Linux 一次即可）：不改代码也能发现检索/注入链路退化——
      # 单元测试只验证结构，这个步骤真的跑指标并卡阈值（阈值在 scripts/eval-offline.ts）
      - name: Initiative simulation redlines (Linux)
        if: runner.os == 'Linux'
        run: npm run initiative:sim

      - name: Offline eval gate (Linux)
        if: runner.os == 'Linux'
        run: npm run eval:offline
